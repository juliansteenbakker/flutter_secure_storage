name: flutter_secure_storage_linux
description: Linux implementation of flutter_secure_storage
repository: https://github.com/mogol/flutter_secure_storage
version: 3.0.1
resolution: workspace

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter_secure_storage_platform_interface: ^2.0.1
  freedesktop_secret: ^0.1.0
  linux_application_id: ^1.0.0

flutter:
  plugin:
    implements: flutter_secure_storage
    platforms:
      linux:
        dartPluginClass: FlutterSecureStorageLinux
        fileName: flutter_secure_storage_linux.dart

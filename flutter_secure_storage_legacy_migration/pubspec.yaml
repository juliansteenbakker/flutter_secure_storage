name: flutter_secure_storage_legacy_migration
description: Optional Android migration for secure storage data written before version 10.
version: 0.1.0
repository: https://github.com/juliansteenbakker/flutter_secure_storage/tree/develop/flutter_secure_storage_legacy_migration
resolution: workspace

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.19.0'

flutter:
  plugin:
    platforms:
      android:
        package: com.it_nomads.fluttersecurestorage_legacy_migration
        pluginClass: FlutterSecureStorageLegacyMigrationPlugin

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

platforms:
  android:

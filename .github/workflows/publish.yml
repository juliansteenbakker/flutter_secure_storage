name: Publish to pub.dev

# release-please tags releases as "<package-directory>-v<version>" (one tag
# per package, since release-please-config.json has include-component-in-tag
# set and each package's component name matches its directory name). This
# extracts the package directory straight from the tag so one workflow can
# publish any workspace package.
on:
  push:
    tags:
      - "flutter_secure_storage-v*"
      - "flutter_secure_storage_legacy_migration-v*"
      - "flutter_secure_storage_platform_interface-v*"
      - "flutter_secure_storage_darwin-v*"
      - "flutter_secure_storage_linux-v*"
      - "flutter_secure_storage_web-v*"
      - "flutter_secure_storage_windows-v*"

jobs:
  publish:
    if: github.repository == 'juliansteenbakker/flutter_secure_storage'
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # Required for pub.dev OIDC authentication.
    steps:
      - uses: actions/checkout@v7

      - name: Resolve package directory from tag
        id: package
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "dir=${TAG%-v*}" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # subosito/flutter-action never fetches the pub.dev OIDC token itself
      # (unlike dart-lang/setup-dart), so without this step `flutter pub
      # publish` silently falls back to interactive OAuth even with
      # id-token: write granted and trusted publishing configured on pub.dev.
      - uses: dart-lang/setup-dart@v1

      - name: Publish ${{ steps.package.outputs.dir }}
        working-directory: ${{ steps.package.outputs.dir }}
        run: flutter pub publish --force

name: release-please

# Opens/updates per-package release PRs (version bump + changelog) based on
# Conventional Commit messages. Merging a release PR tags the release, which
# triggers publish.yml to publish that package to pub.dev.
on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'juliansteenbakker/flutter_secure_storage'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: develop

  # Once any package's release lands on develop, fast-track it onto master so
  # that hotfixes can always be branched from a branch that matches the
  # latest published state. Waits until no other package's release PR is
  # still pending, otherwise their unreleased commits reach master early and
  # release-please-master.yml mistakes them for master-side releases.
  promote-to-master:
    needs: release-please
    # Paused for the flutter_secure_storage_linux 4.0.0-beta.1 release: master
    # must stay on the 3.0.3 baseline so a 3.x hotfix can still be cut from it
    # while the beta is being validated. Re-enable (drop the `&& false`) once
    # the beta is confirmed good.
    if: needs.release-please.outputs.releases_created == 'true' && false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Skip promotion while other release PRs are still pending
        id: gate
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          pending=$(gh pr list --base develop --label "autorelease: pending" --json number --jq length)
          if [ "$pending" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$pending other release PR(s) still open on develop, skipping promotion for now."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open and merge promotion PR into master
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          gh pr create \
            --base master \
            --head develop \
            --title "chore: promote release(s) to master" \
            --body "Automated promotion of newly released package(s) from develop to master." \
            || echo "PR may already exist, continuing"
          # A real merge commit (not squash) is required here so that the
          # tagged release commits on develop stay genuine ancestors of
          # master. release-please-master.yml relies on that ancestry to
          # find the last release when scanning master's history.
          gh pr merge develop --merge

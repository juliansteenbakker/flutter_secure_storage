version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: gradle
    directory: /flutter_secure_storage/android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps

  - package-ecosystem: gradle
    directory: /flutter_secure_storage/example/android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      example-android:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pub
    directory: /flutter_secure_storage
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
      prefix-development: chore

  - package-ecosystem: pub
    directory: /flutter_secure_storage_platform_interface
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
      prefix-development: chore

  - package-ecosystem: pub
    directory: /flutter_secure_storage_darwin
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
      prefix-development: chore

  - package-ecosystem: pub
    directory: /flutter_secure_storage_linux
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
      prefix-development: chore

  - package-ecosystem: pub
    directory: /flutter_secure_storage_web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
      prefix-development: chore

  - package-ecosystem: pub
    directory: /flutter_secure_storage_windows
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
      prefix-development: chore

  # The example resolves the plugin through a path dependency. Dependabot would
  # pin it to the released version, which breaks resolution on the next bump.
  - package-ecosystem: pub
    directory: /flutter_secure_storage/example
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: flutter_secure_storage
    groups:
      example-dart:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
